source:
  workbook: data/raw/UseCase_Airlines.xlsx
  sheets: [flights, bookings, payments, passengers]
  # A missing sheet or a missing column here fails the run immediately: the
  # pipeline can quarantine a bad row, but it cannot infer a column that is
  # not there, and a silent partial load is worse than a stopped one.
  required_columns:
    flights: [flight_id, airline, source, destination, departure_time, arrival_time, duration]
    bookings: [booking_id, passenger_id, flight_id, booking_date, status, seat_number]
    payments: [payment_id, booking_id, amount, payment_method]
    passengers: [passenger_id, first_name, last_name, age, gender, email, phone, aadhaar_id,
                 date_of_birth]

paths:
  bronze: data/bronze
  silver: data/silver
  gold: data/gold
  quarantine: data/quarantine
  warehouse: warehouse/asg_airlines.duckdb
  reports: reports
  logs: reports/logs
  sql: sql

date_dim:
  start: "2025-04-01"
  end: "2026-05-31"

business_rules:
  red_eye_start_hour: 22
  red_eye_end_hour: 4
  max_duration_hours: 24
  age_bands:
    - [0, 17, "0-17"]
    - [18, 30, "18-30"]
    - [31, 45, "31-45"]
    - [46, 60, "46-60"]
    - [61, 999, "60+"]

pii:
  pepper_env_var: ASG_PII_PEPPER
  token_hex_length: 16
